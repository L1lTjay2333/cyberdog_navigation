<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>离线数据处理与灰模</title>
<style>body{margin:24px;background:#101923;color:#dfebf4;font:16px system-ui}h1{font-size:27px}button,select,a{font:inherit}button,select{padding:10px;margin:5px;background:#213c50;color:inherit;border:1px solid #618198;border-radius:7px}button:disabled{opacity:.4}a{color:#80d1ff;margin:8px;display:inline-block}#status,#metrics{padding:12px;background:#1c2c3a;margin:12px 0;white-space:pre-wrap}#view{height:58vh;min-height:320px;position:relative}canvas{display:block;width:100%;height:100%}.note{color:#afc1cd;line-height:1.7}#error{color:#ffb7a8}</style>
<h1>离线数据处理与灰模</h1><p class="note">只处理电脑已保存的数据，不连接机器狗。原始数据和每次处理结果均保留。当前沿用采集位姿，尚未完成闭环纠偏与真实尺寸验收。</p>
<p><a href="http://127.0.0.1:8769/near_range/">查看 10 月 29 日扫描：原范围 / 2 米近景建模对照</a>（已保存结果，需本机对照服务运行）</p>
<div><select id="session" aria-label="已有采集记录"></select><button id="refresh">刷新记录</button><button id="start">处理所选记录</button><button id="cancel" disabled>取消处理</button></div>
<div id="status" role="status">正在读取电脑记录…</div><div id="error" role="alert"></div><div id="metrics">尚未加载处理结果</div>
<div><button data-layer="observed" disabled>完整观测灰模</button><button data-layer="supported" disabled>较高支持灰模</button><button data-layer="points" disabled>处理后点云</button><button id="fit">适合窗口</button><span id="layer-note"></span></div>
<div id="view"></div><div id="downloads"></div><p class="note">拖动旋转，滚轮缩放，右键拖动平移。较高支持表示融合权重较高，并不等于测量精度更高；单次观测可能是真实新表面。预览有数量限制，下载保留完整结果。</p><a href="http://127.0.0.1:8766/">返回采集网页</a>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from '/vendor/OrbitControls.js';
const $=id=>document.getElementById(id), host=$('view'), scene=new THREE.Scene();scene.background=new THREE.Color('#0b131c');
const camera=new THREE.PerspectiveCamera(50,1,.01,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;camera.up.set(0,0,1);camera.position.set(3,-4,3);scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(2,-3,5);scene.add(sun);scene.add(new THREE.AxesHelper(.4));
new ResizeObserver(()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)}).observe(host);
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
let result=null,run=null,object=null,token=0,loadedRun=null;
async function api(path,data){const response=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await response.json();if(!response.ok)throw Error(body.error||'请求失败');return body}
async function sessions(){try{const data=await api('/api/sessions'),previous=$('session').value;$('session').replaceChildren();for(const row of data.sessions){const option=document.createElement('option');option.value=row.id;option.textContent=`${row.id} · ${row.frames}帧`; $('session').append(option)}if([...$('session').options].some(x=>x.value===previous))$('session').value=previous;if(!data.sessions.length)$('error').textContent='没有完整可处理的原始采集记录。'}catch(e){$('error').textContent=e.message}}
function fit(){if(!object)return;const box=new THREE.Box3().setFromObject(object),center=box.getCenter(new THREE.Vector3()),size=Math.max(box.getSize(new THREE.Vector3()).length(),.2);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1,-1,.8).normalize().multiplyScalar(size*1.3));camera.far=Math.max(100,size*10);camera.updateProjectionMatrix();controls.update()}
async function layer(key,reset=false){const mine=++token,descriptor=result?.previews[key];if(!descriptor)return;try{const response=await fetch(`/result/${run}/${descriptor.file}`);if(!response.ok)throw Error('预览文件不可用');const buffer=await response.arrayBuffer();if(mine!==token)return;const count=descriptor.position_count,limit=descriptor.kind==='mesh'?450000:30000;if(!Number.isInteger(count)||count<=0||count>limit||buffer.byteLength!==count*12)throw Error('预览数据长度异常');const positions=new Float32Array(buffer);if(!positions.every(Number.isFinite))throw Error('预览包含无效坐标');const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));let next;if(descriptor.kind==='mesh'){geometry.computeVertexNormals();next=new THREE.Mesh(geometry,new THREE.MeshLambertMaterial({color:0xb6b6b6,side:THREE.DoubleSide}))}else next=new THREE.Points(geometry,new THREE.PointsMaterial({color:0xc6c6c6,size:.015}));if(object){scene.remove(object);object.geometry.dispose();object.material.dispose()}object=next;scene.add(object);$('layer-note').textContent=descriptor.kind==='mesh'?`预览 ${descriptor.displayed_triangles.toLocaleString()} / ${descriptor.full_triangles.toLocaleString()} 个三角面`:`预览 ${descriptor.displayed_points.toLocaleString()} / ${descriptor.full_points.toLocaleString()} 个点`;if(reset)fit();}catch(e){$('error').textContent=e.message}}
function show(value,id){result=value;run=id;$('metrics').textContent=`采集 ${value.frames} 帧 · 处理后点 ${value.processed_points.toLocaleString()} · 待确认点 ${value.excluded_points.toLocaleString()}\n完整观测表面 ${value.observed_triangles.toLocaleString()} 面 · 较高支持表面 ${value.supported_triangles.toLocaleString()} 面\n来源：${value.session}`;for(const button of document.querySelectorAll('[data-layer]'))button.disabled=!value.previews[button.dataset.layer];$('downloads').replaceChildren();for(const [name,label] of [['observed.ply','完整灰模 PLY'],['supported.ply','较高支持灰模 PLY'],['points.ply','处理后点云'],['excluded.ply','待确认点云'],['processing.json','数据处理报告'],['fusion.json','表面融合报告']]){if(name==='supported.ply'&&!value.previews.supported)continue;const link=document.createElement('a');link.href=`/result/${id}/${name}`;link.download=name;link.textContent=label;$('downloads').append(link)}layer('observed',true)}
async function poll(){try{const state=await api('/api/state');$('status').textContent=state.message;$('start').disabled=state.status==='running';$('cancel').disabled=state.status!=='running';if(state.status==='done'&&state.run!==loadedRun){loadedRun=state.run;show(state.results,state.run)}}catch(e){$('error').textContent=e.message}finally{setTimeout(poll,1000)}}
$('refresh').onclick=sessions;$('start').onclick=async()=>{try{$('error').textContent='';$('start').disabled=true;await api('/api/start',{session:$('session').value});$('status').textContent='离线任务已提交，正在处理…'}catch(e){$('error').textContent=e.message;$('start').disabled=false}};$('cancel').onclick=async()=>{try{await api('/api/cancel',{})}catch(e){$('error').textContent=e.message}};for(const button of document.querySelectorAll('[data-layer]'))button.onclick=()=>layer(button.dataset.layer);$('fit').onclick=fit;await sessions();poll();
</script></html>
