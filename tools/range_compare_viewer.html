<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>近景建模对照</title>
<style>body{background:#111b25;color:#dbe8f3;font:16px system-ui;margin:24px}button{font:inherit;padding:10px;margin:5px;background:#274257;color:inherit;border:1px solid #7191a4;border-radius:6px}#view{height:65vh}canvas{display:block;width:100%;height:100%}p{line-height:1.7}a{color:#83d5ff;margin:8px}#status{padding:12px;background:#1d3040;white-space:pre-wrap}</style>
<h1>近景建模对照</h1><p>使用同一次扫描、同一组原始位姿。近景版本只融合每帧相机前方 <span id="range">指定范围</span>内的深度，远处记录仍保留在原始文件中。覆盖范围会缩小；缺失座面未补造，整圈位姿纠偏尚未通过。</p>
<button id="baseline">原范围模型（4 米）</button><button id="near">近景模型</button><button id="supported">近景多帧支持表面</button><button id="fit">适合窗口</button><div id="status">正在加载…</div><div id="view"></div><a href="near.ply" download>下载近景完整模型</a><a href="supported.ply" download>下载近景多帧支持模型</a><a href="range_report.json">检查报告</a><a href="http://127.0.0.1:8768/">返回工作台</a>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from './OrbitControls.js';
const $=id=>document.getElementById(id),host=$('view'),scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true}),camera=new THREE.PerspectiveCamera(50,1,.01,100);
scene.background=new THREE.Color('#0b141c');camera.up.set(0,0,1);host.append(renderer.domElement);renderer.setPixelRatio(Math.min(devicePixelRatio,2));const controls=new OrbitControls(camera,renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,-3,5);scene.add(light);scene.add(new THREE.AxesHelper(.3));new ResizeObserver(()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)}).observe(host);function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();let data,object,token=0;
function fit(){if(!object)return;const box=new THREE.Box3().setFromObject(object),center=box.getCenter(new THREE.Vector3()),size=Math.max(box.getSize(new THREE.Vector3()).length(),.3);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1,-1,.7).normalize().multiplyScalar(size));controls.update()}
async function show(key,reset=false){const mine=++token,d=data.previews[key];delete host.dataset.loaded;if(!d){$('status').textContent='这一层没有可提取的表面';if(object)object.visible=false;return}const r=await fetch(d.file);if(!r.ok)throw Error('读取模型失败');const buf=await r.arrayBuffer();if(mine!==token)return;if(buf.byteLength!==d.position_count*12||d.position_count>450000)throw Error('模型尺寸异常');const p=new Float32Array(buf);if(!p.every(Number.isFinite))throw Error('模型坐标异常');const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(p,3));geometry.computeVertexNormals();if(object){scene.remove(object);object.geometry.dispose();object.material.dispose()}object=new THREE.Mesh(geometry,new THREE.MeshLambertMaterial({color:0xb5b5b5,side:THREE.DoubleSide}));scene.add(object);$('status').textContent=`${{baseline:'原范围模型',near:'近景模型',supported:'近景多帧支持表面'}[key]} · ${data.frames} 帧\n完整模型 ${d.full_triangles.toLocaleString()} 面；预览 ${d.displayed_triangles.toLocaleString()} 面\n位姿未修改；模型变少不代表精度通过，需同时观察细节与覆盖。`;if(reset)fit();host.dataset.loaded=key}
function safe(key,reset){show(key,reset).catch(e=>{$('status').textContent=e.message})}for(const key of ['baseline','near','supported'])$(key).onclick=()=>safe(key,false);$('fit').onclick=fit;
try{const r=await fetch('range_report.json');if(!r.ok)throw Error('报告读取失败');data=await r.json();$('range').textContent=data.max_depth_m+' 米';$('near').textContent='近景模型（'+data.max_depth_m+' 米）';safe('near',true)}catch(e){$('status').textContent=e.message}
</script></html>
