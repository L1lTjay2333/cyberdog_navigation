<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>转向分段重建对照</title>
<style>body{background:#111b25;color:#dbe8f3;font:16px system-ui;margin:24px}button,select{font:inherit;padding:10px;margin:5px;background:#274257;color:inherit;border:1px solid #7191a4;border-radius:6px}#view{height:65vh}canvas{display:block;width:100%;height:100%}p{line-height:1.7}a{color:#83d5ff;margin:8px}#status{padding:12px;background:#1d3040;white-space:pre-wrap}</style>
<h1>转向分段重建对照 · 实验</h1><p>对齐检查不通过就另起一段，全部原始帧保留。各段有独立锚点，尚未校准段与段之间的位置，不能合并当作已纠偏的整屋模型。主工作台的原模型不变。</p>
<select id="segment" aria-label="选择数据段"></select><button id="baseline">原位姿分段灰模</button><button id="refined">局部对齐分段灰模</button><button id="fit">适合窗口</button><div id="status">正在加载分段结果…</div><div id="view"></div><div id="links"></div><a href="http://127.0.0.1:8768/">返回主工作台</a>
<script type="importmap">{"imports":{"three":"../three.module.js"}}</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from '../OrbitControls.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene(),host=$('view'),renderer=new THREE.WebGLRenderer({antialias:true});scene.background=new THREE.Color('#0b141c');renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(50,1,.01,100);camera.up.set(0,0,1);camera.position.set(4,-5,3);const controls=new OrbitControls(camera,renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,-3,5);scene.add(light);scene.add(new THREE.AxesHelper(.3));new ResizeObserver(()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)}).observe(host);function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
let data,object,token=0,mode='refined';
const reasons={first_frame:'首帧',excessive_correction:'局部修正超过上限',cumulative_correction_limit:'累计修正超过上限',lost_validation_overlap:'验证区域重叠不足',degenerate_geometry:'几何约束不足',validation_residual_too_large:'残差过大',insufficient_overlap:'视野重叠不足',no_significant_improvement:'未通过改善检查'};
function fit(){if(!object)return;const box=new THREE.Box3().setFromObject(object),center=box.getCenter(new THREE.Vector3()),size=Math.max(box.getSize(new THREE.Vector3()).length(),.2);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1,-1,.7).normalize().multiplyScalar(size*.95));controls.update()}
async function load(reset=false){const mine=++token,row=data.segments[Number($('segment').value)],preview=row.previews[mode];$('status').textContent=`共 ${data.source_frames} 帧 / ${data.segments.length} 段，所有帧各保留一次。\n本段第 ${row.first_frame}–${row.last_frame} 帧；断段原因：${reasons[row.start_reason]||row.start_reason}\n${mode==='refined'?'局部对齐':'原位姿'} · 实验结果，无绝对精度验证。`;$('links').replaceChildren();for(const [key,label] of [['baseline','下载本段原位姿灰模'],['refined','下载本段局部对齐灰模']])if(row.previews[key]){const a=document.createElement('a');a.href=`segment_${String(row.segment).padStart(3,'0')}/${key}.ply`;a.download=`segment_${row.segment}_${key}.ply`;a.textContent=label;$('links').append(a)}if(!preview){if(object){scene.remove(object);object.geometry.dispose();object.material.dispose();object=null}$('status').textContent+='\n本段未提取出表面；原始帧已保留。';return}const response=await fetch(preview.file);if(!response.ok)throw Error('预览读取失败');const buffer=await response.arrayBuffer();if(mine!==token)return;if(buffer.byteLength!==preview.position_count*12||preview.position_count>450000)throw Error('预览尺寸异常');const positions=new Float32Array(buffer);if(!positions.every(Number.isFinite))throw Error('无效坐标');const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));geometry.computeVertexNormals();if(object){scene.remove(object);object.geometry.dispose();object.material.dispose()}object=new THREE.Mesh(geometry,new THREE.MeshLambertMaterial({color:0xb5b5b5,side:THREE.DoubleSide}));scene.add(object);$('status').textContent+=`\n预览 ${preview.displayed_triangles.toLocaleString()} / ${preview.full_triangles.toLocaleString()} 面`;if(reset)fit()}
function show(reset){const mine=token+1,selection=$('segment').value,layer=mode;load(reset).then(()=>{if(token!==mine)return;host.dataset.loaded=selection+':'+layer;if(data.segments[Number(selection)].frames===1)$('status').textContent+='\n单帧段：未执行跨帧配准，两版本相同。'}).catch(error=>{$('status').textContent=error.message})}
$('segment').onchange=()=>show(true);$('baseline').onclick=()=>{mode='baseline';show(false)};$('refined').onclick=()=>{mode='refined';show(false)};$('fit').onclick=fit;
try{const response=await fetch('segments.json');if(!response.ok)throw Error('结果读取失败');data=await response.json();for(const [index,row] of data.segments.entries()){const option=document.createElement('option');option.value=index;option.textContent=`第${index+1}段 · ${row.first_frame}–${row.last_frame}帧`;$('segment').append(option)}show(true)}catch(error){$('status').textContent=error.message}
</script></html>
