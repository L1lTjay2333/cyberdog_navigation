<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>多视角边缘确认</title><style>body{margin:24px;background:#111b25;color:#dbe8ef;font:16px system-ui}p{line-height:1.7}button{font:inherit;background:#284457;color:inherit;padding:10px;margin:5px;border:1px solid #7194a8;border-radius:6px}#view{height:65vh}#status{padding:12px;background:#203342;white-space:pre-wrap}a{color:#86d0ff}</style>
<h1>多视角边缘确认 · 实验</h1><p>非边缘深度保持不变；边缘需邻近两帧支持且无自由空间冲突。未确认边缘可能包含真实细框架，仍保留为单独层。原位姿与主工作台不变，座面缺失未解决。</p><button id="baseline">原始融合灰模</button><button id="confirmed">多视角确认灰模</button><button id="pending">叠加待确认边缘</button><button id="fit">适合窗口</button><div id="status">正在加载…</div><div id="view"></div><a href="confirmed.ply" download>下载实验完整灰模</a> · <a href="edge_report.json">查看报告</a> · <a href="http://127.0.0.1:8768/">返回主工作台</a>
<script type="importmap">{"imports":{"three":"../three.module.js"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'../OrbitControls.js';const $=id=>document.getElementById(id),host=$('view'),scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true}),camera=new THREE.PerspectiveCamera(50,1,.01,100);scene.background=new THREE.Color('#0a131b');camera.up.set(0,0,1);camera.position.set(3,-3,2);host.append(renderer.domElement);renderer.setPixelRatio(Math.min(devicePixelRatio,2));const controls=new OrbitControls(camera,renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,-3,5);scene.add(light);scene.add(new THREE.AxesHelper(.3));new ResizeObserver(()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)}).observe(host);function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();let data,object,pending,token=0;
function fit(){if(!object)return;const box=new THREE.Box3().setFromObject(object),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()).length();controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1,-1,.7).normalize().multiplyScalar(Math.max(.5,size)));controls.update()}
async function positions(descriptor){const r=await fetch(descriptor.file);if(!r.ok)throw Error('预览读取失败');const a=new Float32Array(await r.arrayBuffer());if(a.length!==descriptor.position_count*3||descriptor.position_count>450000||!a.every(Number.isFinite))throw Error('预览数据异常');const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));return g}
async function show(key,reset=false){const mine=++token,g=await positions(data[key]);if(mine!==token){g.dispose();return}g.computeVertexNormals();if(object){scene.remove(object);object.geometry.dispose();object.material.dispose()}object=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0xb5b5b5,side:THREE.DoubleSide}));scene.add(object);$('status').textContent=`${key==='baseline'?'原始融合':'实验多视角确认'}：${data[key].full_triangles.toLocaleString()}面\n确认边缘观测 ${data.totals.confirmed_edge.toLocaleString()} / ${data.totals.edge.toLocaleString()}；待确认 ${data.totals.uncertain_edge.toLocaleString()}（不等于噪声）\n橙色层只显示待确认边缘的抽样，不代表全部观测。未验证几何精度提升。`;if(reset)fit();host.dataset.loaded=key}
function safe(key,reset){show(key,reset).catch(e=>{$('status').textContent=e.message})}$('baseline').onclick=()=>safe('baseline',false);$('confirmed').onclick=()=>safe('confirmed',false);$('fit').onclick=fit;$('pending').onclick=async()=>{try{if(!pending){pending=new THREE.Points(await positions(data.pending),new THREE.PointsMaterial({color:0xffa33c,size:.012}));scene.add(pending)}else pending.visible=!pending.visible;host.dataset.pending=String(pending.visible)}catch(e){$('status').textContent=e.message}};try{data=await(await fetch('view.json')).json();safe('confirmed',true)}catch(e){$('status').textContent=e.message}
</script></html>
