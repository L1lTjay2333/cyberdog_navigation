<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>毛刺来源对照</title><style>body{background:#111c27;color:#dae6ee;font:16px system-ui;margin:24px}p{line-height:1.7}button,select{font:inherit;padding:10px;background:#28475a;color:inherit;margin:5px;border:1px solid #7599ad;border-radius:6px}#view{height:65vh}canvas{display:block}#status{white-space:pre-wrap;padding:12px;background:#22323f}a{color:#8dd5ff}</style>
<h1>毛刺来源对照 · 离线实验</h1><p>相同10帧规模，比较静止与移动片段，以及排除深度突变边缘前后。边缘排除也会损失真实细框架，不能把更少的碎片直接当成精度更高。原始数据及主工作台保持不变。</p><select id="case"><option value="0">静止片段</option><option value="1">移动片段</option></select><button id="baseline">现有深度处理</button><button id="interior">实验：排除突变边缘</button><button id="fit">适合窗口</button><div id="status">读取数据…</div><div id="view"></div><a id="download">下载当前完整灰模</a> · <a href="audit.json">查看检查报告</a> · <a href="http://127.0.0.1:8768/">返回主工作台</a>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'./OrbitControls.js';
const $=id=>document.getElementById(id),host=$('view'),scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true}),camera=new THREE.PerspectiveCamera(50,1,.01,100);renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.append(renderer.domElement);scene.background=new THREE.Color('#0a131c');camera.up.set(0,0,1);camera.position.set(3,-3,2);const controls=new OrbitControls(camera,renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,-3,5);scene.add(light);scene.add(new THREE.AxesHelper(.3));new ResizeObserver(()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)}).observe(host);function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();let data,mode='baseline',object,token=0;
function fit(){if(!object)return;const box=new THREE.Box3().setFromObject(object),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()).length();controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1,-1,.6).normalize().multiplyScalar(Math.max(.5,size)));controls.update()}
async function show(reset=false){const mine=++token,index=Number($('case').value),row=data.cases[index],layer=mode,p=row.previews[layer];if(!p)throw Error('该层无可提取表面');const response=await fetch(p.file);if(!response.ok)throw Error('读取预览失败');const buffer=await response.arrayBuffer();if(mine!==token)return;const a=new Float32Array(buffer);if(a.length!==p.position_count*3||p.position_count>450000||!a.every(Number.isFinite))throw Error('预览异常');const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(a,3));geometry.computeVertexNormals();if(object){scene.remove(object);object.geometry.dispose();object.material.dispose()}object=new THREE.Mesh(geometry,new THREE.MeshLambertMaterial({color:0xb8b8b8,side:THREE.DoubleSide}));scene.add(object);const report=row.reports[layer],difference=row.endpoint_consistency.absolute_depth_residual_m.median;$('status').textContent=`源帧 ${row.selection.start+1}–${row.selection.end}，共${row.frames}帧\n片段最大平移 ${(row.selection.max_translation_m*100).toFixed(1)}厘米，最大转角 ${row.selection.max_angle_deg.toFixed(2)}度\n首尾重投影差异中位数 ${(difference*1000).toFixed(1)}毫米（非绝对精度）\n${layer==='baseline'?'现有深度处理':'实验排除边缘'}：${report.all_observations.triangles.toLocaleString()}面、${report.components.toLocaleString()}个连通部分\n小连通部分面积占比 ${(report.small_component_area_fraction*100).toFixed(2)}%（真实细节也可能在内）`;$('download').href=row.name+'/'+layer+'.ply';$('download').download=row.name+'_'+layer+'.ply';if(reset)fit();host.dataset.loaded=index+':'+layer}
const safe=reset=>show(reset).catch(e=>{$('status').textContent=e.message});$('case').onchange=()=>safe(true);$('baseline').onclick=()=>{mode='baseline';safe(false)};$('interior').onclick=()=>{mode='interior';safe(false)};$('fit').onclick=fit;try{const response=await fetch('audit.json');data=await response.json();safe(true)}catch(e){$('status').textContent=e.message}
</script></html>
